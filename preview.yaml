# What tools/preview.py shows: a Nord Pool sensor with quarters of today and tomorrow, a Dutch tariff and a feed-in
# price, as a stepped line of the next 24 hours and as bars; an ENTSO-e sensor with the hours of today and a fixed
# feed-in price that is at times above the delivery price, as a stepped line without fill; and an EPEX Spot sensor with
# yesterday, today and tomorrow in one list; and an Energi Data Service sensor in kr/kWh with Carnot's forecast after
# the known prices (from Andware's Elpris). Each example also gets a page of its own at full size.
tiles:
  - tile: nordpool
    name: Next 24 h
    entity: sensor.nordpool
    options: { delivery: "(p+0.12)*1.21", feed_in: "p-0.02", graph: line, grid: dotted, ahead: true, resolution: hour, cheap: 3, cheap_mode: block }
    sizes: [2x2, 4x2]
  - tile: nordpool
    name: Nord Pool
    entity: sensor.nordpool
    options: { delivery: "(p+0.12)*1.21", feed_in: "p-0.02", grid: solid }
    sizes: [1x1, 2x1, 4x2]
  - tile: entsoe
    name: ENTSO-e
    entity: sensor.entsoe
    options: { unit: cents, fixed: 1, feed_in: "0,30", graph: line, fill: false }
    sizes: [1x1, 3x2]
  - tile: epex
    name: EPEX Spot
    entity: sensor.epex_spot_data_total_price
    options: { unit: cents, fixed: 1 }
    sizes: [1x1, 2x2, 4x2]
  - tile: energidataservice
    name: Elpris
    entity: sensor.energidatamedafgifter
    options: { grid: dotted, cheap: 3, ahead: true }
    sizes: [2x2, 4x2]

