      - { id: cheap_below, kind: number, optional: true, group: group_colours, min: -1000, max: 1000, step: 0.01, label: cheap_below, hint: cheap_below_hint }
      - { id: expensive_above, kind: number, optional: true, group: group_colours, min: -1000, max: 1000, step: 0.01, label: expensive_above, hint: expensive_above_hint }
  - id: energidataservice
    name: tile_name_eds
    icon: flash
    sizes: { min: 1x1, max: 9x9, full: true }
    memory: 8000
    domains: [sensor]
    attributes: [unit_of_measurement]
    has_attributes: [raw_today, today_mean]
    # Today's and tomorrow's lists, and Carnot's forecast of the hours after them (when it is on in the integration),
    # which the graph of the next 24 hours shows in fainter bars. After Andware's Elpris (Energi Data Service).
    fields:
      today: { path: "raw_today[*].price", as: numbers }
      tomorrow: { path: "raw_tomorrow[*].price", as: numbers }
      outlook: { path: "forecast[*].price", as: numbers }
      outlook_start: { path: "forecast[0].hour", as: epoch }
    example: tile_example
    preview: { title: "{name}", value: "{state} {unit_of_measurement}" }
    options:
      - id: unit
        kind: choice
        default: eur
        label: unit
        hint: unit_hint
