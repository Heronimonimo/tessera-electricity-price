      - { id: show_name, kind: toggle, default: true, label: show_name, hint: show_name_hint }
      - { id: cheap_below, kind: number, optional: true, group: group_colours, min: -1000, max: 1000, step: 0.01, label: cheap_below, hint: cheap_below_hint }
      - { id: expensive_above, kind: number, optional: true, group: group_colours, min: -1000, max: 1000, step: 0.01, label: expensive_above, hint: expensive_above_hint }
  - id: gespot
    name: tile_name_gespot
    icon: flash
    sizes: { min: 1x1, max: 9x9, full: true }
    memory: 8000
    domains: [sensor]
    attributes: [unit_of_measurement]
    has_attributes: [today_interval_prices]
    fields:
      today: { path: "today_interval_prices[*].value", as: numbers }
      tomorrow: { path: "tomorrow_interval_prices[*].value", as: numbers }
