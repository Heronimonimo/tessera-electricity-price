# Electricity price: the price of power now as a tile, and the graph of today and tomorrow on bigger tiles and on a
# card, with the person's own tariff on top: (p + a) x b + c for delivery and, when on, for feed-in. It reads the sensor of Nord Pool (HACS `nordpool`), ENTSO-e (`entsoe`) or GE-Spot (`ge_spot`) from Home Assistant.
id: electricity_price
version: 0.7.0
api: "0.12"
icon: flash
maintainer: Heronimonimo
license: MIT
stage: beta
topics: [energy]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 10

tiles:
  # One tile per integration: has_attributes keeps the inspector's list to the sensors that belong to it.
  - id: nordpool
    name: tile_name_nordpool
    icon: flash
    sizes: { min: 1x1, max: 9x9, full: true }
    memory: 13000
    domains: [sensor]
    attributes: [unit_of_measurement]
    has_attributes: [raw_today]
    fields:
      today: { path: "raw_today[*].value", as: numbers }
      tomorrow: { path: "raw_tomorrow[*].value", as: numbers }
    example: tile_example
    preview: { title: "{name}", value: "{state} {unit_of_measurement}" }
    options:
      - id: unit
        kind: choice
        default: eur
        label: unit
        hint: unit_hint
        choices:
          - { value: eur, label: unit_eur }
          - { value: cents, label: unit_cents }
      - { id: fixed, kind: number, min: 0, max: 4, step: 1, default: 3, label: decimals, hint: decimals_hint }
      - { id: extra, kind: number, min: -1, max: 1, step: 0.0001, default: 0, unit: "/kWh", label: extra, hint: extra_hint }
      - { id: factor, kind: number, min: 0, max: 3, step: 0.01, default: 1, label: factor, hint: factor_hint }
      - { id: plus, kind: number, min: -1, max: 2, step: 0.0001, default: 0, unit: "/kWh", label: plus, hint: plus_hint }
      - { id: feed_in, kind: toggle, default: false, label: feed_in, hint: feed_in_hint }
      - { id: feed_extra, kind: number, min: -1, max: 1, step: 0.0001, default: 0, unit: "/kWh", label: feed_extra, hint: feed_extra_hint }
      - { id: feed_factor, kind: number, min: 0, max: 3, step: 0.01, default: 1, label: feed_factor, hint: feed_factor_hint }
      - { id: feed_plus, kind: number, min: -1, max: 2, step: 0.0001, default: 0, unit: "/kWh", label: feed_plus, hint: feed_plus_hint }
  - id: entsoe
    name: tile_name_entsoe
    icon: flash
    sizes: { min: 1x1, max: 9x9, full: true }
    memory: 13000
    domains: [sensor]
    attributes: [unit_of_measurement]
    has_attributes: [prices_today]
    fields:
      today: { path: "prices_today[*].price", as: numbers }
      tomorrow: { path: "prices_tomorrow[*].price", as: numbers }
    example: tile_example
    preview: { title: "{name}", value: "{state} {unit_of_measurement}" }
    options:
      - id: unit
        kind: choice
        default: eur
        label: unit
        hint: unit_hint
        choices:
          - { value: eur, label: unit_eur }
          - { value: cents, label: unit_cents }
      - { id: fixed, kind: number, min: 0, max: 4, step: 1, default: 3, label: decimals, hint: decimals_hint }
      - { id: extra, kind: number, min: -1, max: 1, step: 0.0001, default: 0, unit: "/kWh", label: extra, hint: extra_hint }
      - { id: factor, kind: number, min: 0, max: 3, step: 0.01, default: 1, label: factor, hint: factor_hint }
      - { id: plus, kind: number, min: -1, max: 2, step: 0.0001, default: 0, unit: "/kWh", label: plus, hint: plus_hint }
      - { id: feed_in, kind: toggle, default: false, label: feed_in, hint: feed_in_hint }
      - { id: feed_extra, kind: number, min: -1, max: 1, step: 0.0001, default: 0, unit: "/kWh", label: feed_extra, hint: feed_extra_hint }
      - { id: feed_factor, kind: number, min: 0, max: 3, step: 0.01, default: 1, label: feed_factor, hint: feed_factor_hint }
      - { id: feed_plus, kind: number, min: -1, max: 2, step: 0.0001, default: 0, unit: "/kWh", label: feed_plus, hint: feed_plus_hint }
  - id: gespot
    name: tile_name_gespot
    icon: flash
    sizes: { min: 1x1, max: 9x9, full: true }
    memory: 13000
    domains: [sensor]
    attributes: [unit_of_measurement]
    has_attributes: [today_interval_prices]
    fields:
      today: { path: "today_interval_prices[*].value", as: numbers }
      tomorrow: { path: "tomorrow_interval_prices[*].value", as: numbers }
    example: tile_example
    preview: { title: "{name}", value: "{state} {unit_of_measurement}" }
    options:
      - id: unit
        kind: choice
        default: eur
        label: unit
        hint: unit_hint
        choices:
          - { value: eur, label: unit_eur }
          - { value: cents, label: unit_cents }
      - { id: fixed, kind: number, min: 0, max: 4, step: 1, default: 3, label: decimals, hint: decimals_hint }
      - { id: extra, kind: number, min: -1, max: 1, step: 0.0001, default: 0, unit: "/kWh", label: extra, hint: extra_hint }
      - { id: factor, kind: number, min: 0, max: 3, step: 0.01, default: 1, label: factor, hint: factor_hint }
      - { id: plus, kind: number, min: -1, max: 2, step: 0.0001, default: 0, unit: "/kWh", label: plus, hint: plus_hint }
      - { id: feed_in, kind: toggle, default: false, label: feed_in, hint: feed_in_hint }
      - { id: feed_extra, kind: number, min: -1, max: 1, step: 0.0001, default: 0, unit: "/kWh", label: feed_extra, hint: feed_extra_hint }
      - { id: feed_factor, kind: number, min: 0, max: 3, step: 0.01, default: 1, label: feed_factor, hint: feed_factor_hint }
      - { id: feed_plus, kind: number, min: -1, max: 2, step: 0.0001, default: 0, unit: "/kWh", label: feed_plus, hint: feed_plus_hint }

cards:
  - { id: prices, name: card_name, wide: true }
