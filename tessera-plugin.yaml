      - { id: cheap, kind: number, min: 0, max: 6, step: 1, default: 0, label: cheap, hint: cheap_hint }
      - id: cheap_mode
        kind: choice
        default: single
        label: cheap_mode
        hint: cheap_mode_hint
        choices:
          - { value: single, label: cheap_single }
          - { value: block, label: cheap_block }
      - { id: show_name, kind: toggle, default: true, label: show_name, hint: show_name_hint }
      - { id: cheap_below, kind: number, optional: true, group: group_colours, min: -1000, max: 1000, step: 0.01, label: cheap_below, hint: cheap_below_hint }
      - { id: expensive_above, kind: number, optional: true, group: group_colours, min: -1000, max: 1000, step: 0.01, label: expensive_above, hint: expensive_above_hint }
  - id: epex
    name: tile_name_epex
    icon: flash
    sizes: { min: 1x1, max: 9x9, full: true }
    memory: 8000
    domains: [sensor]
    attributes: [unit_of_measurement]
    has_attributes: [data]
    # One list of yesterday, today and tomorrow: the screen cuts the days out of it by the start of the first two slots.
    fields:
      prices: { path: "data[*].price_per_kwh", as: numbers }
      first: { path: "data[0].start_time", as: epoch }
      second: { path: "data[1].start_time", as: epoch }
    example: tile_example
    preview: { title: "{name}", value: "{state} {unit_of_measurement}" }
    options:
      - id: unit
        kind: choice
        default: eur
        label: unit
        hint: unit_hint
        choices:
          - { value: eur, label: unit_eur }
          - { value: cents, label: unit_cents }
      - { id: fixed, kind: number, min: 0, max: 4, step: 1, default: 3, label: decimals, hint: decimals_hint }
      - { id: delivery, kind: text, default: "", label: delivery, hint: delivery_hint }
